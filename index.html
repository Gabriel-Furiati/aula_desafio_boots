<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Loja - Tênis</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!--fixed-top: Fixa cabeçalho no topo; shadow-sm: Sombra clara; px-3: espaçamento 3-->
    <header id="app-header" class="navbar navbar-dark bg-danger fixed-top shadow-sm px-3">
        <!--mb: Margin Bottom; h5: Tamanho do texto; d-flex: Display Flex -->
        <span class="navbar-brand mb-0 h5 d-flex align-items-center">
            <strong>Eventos - SENAI Zerbini</strong> <!-- Texto forte (negrito) -->
        </span>
        <!--rounded-cicrcle: Arredonda para ficar uma bola-->
        <div class="photo_profile d-flex align-items-center justify-content-center bg-white rounded-circle">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/SENAI_S%C3%A3o_Paulo_logo.png/960px-SENAI_S%C3%A3o_Paulo_logo.png" alt="Logo" class="img-fluid rounded-circle"> <!-- eu mexi nessa linha :)-->
        </div>
    </header>
 
    <main class="container-fluid">
        <div class="row">
            <!-- total de colunas 12, em telas médias 3 colunas pro aside, em telas grandes coluna 2-->
             <!-- l-0: Left 0 -->
            <aside class="col-12 col-md-3 col-lg-2 sidebar text-white bg-danger p-3 mt-5 l-0">
                <nav class="nav flex-md-column flex-row nav-pills gap-2">
                    <a id="home" href="#" class="nav-link text-white bg-transparent">Home</a>
                    <a id="eventos" href="#" class="nav-link text-white bg-transparent">Eventos</a>
                    <a id="sobre" href="#" class="nav-link text-white bg-transparent">Sobre nós</a>
                    <a id="contato" href="#" class="nav-link text-white bg-transparent">Contato</a>
                </nav>
            </aside>
 
            <!-- pt: Padding Top; pb: Padding bottom -->
            <!-- Total de colunas 12, em telas médias 9 pra section e em telas grandes 10-->
            <section class="col-12 col-md-9 col-lg-10 pt-3 pb-5 mt-5">
               <section class="card shadow-sm position-relative mb-4">
                <div class="card-body">
                    <iframe id="pages"
                    src="" 
                    frameborder="0" 
                    class="w-100 h-100 border rounded"
                    allowfullscreen></iframe>
                </div>
               </section>
            </section>
        </div>
    </main>
   
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="./js/index.js"></script>
</body>
</html>
